name: Build and test offline Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/offline-build.yml"
      - "work/tools/patch_offline_h5.py"
      - "work/tools/patch_android.py"
      - "work/recovered/h5_snapshot.py"
      - "work/recovered/derive_atlas_assets.py"
      - "work/tools/test_offline_apk.sh"
      - "com.ruirui.cjjlq.apk"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: offline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Install APKTool
        shell: bash
        run: |
          sudo mkdir -p /usr/local/lib/apktool
          curl -fL --retry 3 -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          sudo install -m 0644 /tmp/apktool.jar /usr/local/lib/apktool/apktool.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/apktool/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Restore original game H5 client and resources
        shell: bash
        run: |
          mkdir -p tmp/offline-build dist
          python3 -m venv tmp/offline-build/asset-venv
          tmp/offline-build/asset-venv/bin/pip install --disable-pip-version-check --quiet Pillow
          if GH_TOKEN="${{ github.token }}" gh release download h5-source-20261123 \
            --repo "${{ github.repository }}" \
            --pattern recovered-h5-client.zip \
            --dir tmp/offline-build/h5-archive; then
            echo "Using the archived original H5 source bundle."
            unzip -q tmp/offline-build/h5-archive/recovered-h5-client.zip \
              -d tmp/offline-build/h5-archive/extracted
            test -s tmp/offline-build/h5-archive/extracted/client/code.js
            mkdir -p tmp/offline-build/game
            cp -a tmp/offline-build/h5-archive/extracted/client/. tmp/offline-build/game/
            cp -f tmp/offline-build/h5-archive/extracted/snapshot-manifest.json \
              tmp/offline-build/snapshot-manifest.json
            echo "Restored $(find tmp/offline-build/game -type f | wc -l) archived H5 files."
          else
            echo "Archived H5 bundle unavailable; trying a live snapshot."
            if ! python3 work/recovered/h5_snapshot.py \
              --output tmp/offline-build/game \
              --max-total-mib 700 \
              --workers 16 | tee tmp/offline-build/snapshot-summary.json; then
              echo "Live H5 snapshot failed; falling back to the real APK artifact #92."
              mkdir -p tmp/offline-build/cache-artifact tmp/offline-build/cache-apk
              GH_TOKEN="${{ github.token }}" gh run download 45383112667 \
                --repo "${{ github.repository }}" \
                --name offline-apk-test-92 \
                --dir tmp/offline-build/cache-artifact
              CACHED_APK="$(find tmp/offline-build/cache-artifact -type f \
                -name 'super-spirit-ball-offline.apk' -print -quit)"
              test -n "$CACHED_APK"
              unzip -tq "$CACHED_APK" >/dev/null
              unzip -q "$CACHED_APK" 'assets/game/*' -d tmp/offline-build/cache-apk
              test -s tmp/offline-build/cache-apk/assets/game/code.js
              mkdir -p tmp/offline-build/game
              cp -a tmp/offline-build/cache-apk/assets/game/. tmp/offline-build/game/
              echo "Restored cached H5 assets from APK artifact #92."
            fi
          fi
          tmp/offline-build/asset-venv/bin/python work/recovered/derive_atlas_assets.py tmp/offline-build/game
          test -s tmp/offline-build/game/index.html
          test -s tmp/offline-build/game/code.js
          test -s tmp/offline-build/game/zip.txt
          test -s tmp/offline-build/game/libQuickSDKH5_To_Client.js

      - name: Apply local login, data, WebSocket and save patch
        run: |
          python3 work/tools/patch_offline_h5.py tmp/offline-build/game
          node --check tmp/offline-build/game/code.js

      - name: Decode APK and point WebView to local H5
        shell: bash
        run: |
          apktool d -f com.ruirui.cjjlq.apk -o tmp/offline-build/decoded
          python3 work/tools/patch_android.py tmp/offline-build/decoded
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("tmp/offline-build/decoded")
          old = "https://cjjlqres.ruiruiyouxi.com/taptapReleaseRes/index.html"
          new = "file:///android_asset/game/index.html"
          changed = []
          for path in root.rglob("*.smali"):
              text = path.read_text(encoding="utf-8", errors="replace")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))
          if not changed:
              raise SystemExit("H5 entry URL was not found in decoded smali")
          print("Patched H5 entry in:", *changed, sep="\n  ")
          assets = root / "assets" / "game"
          assets.mkdir(parents=True, exist_ok=True)
          import shutil
          shutil.copytree("tmp/offline-build/game", assets, dirs_exist_ok=True)
          required = ["index.html", "code.js", "zip.txt", "libQuickSDKH5_To_Client.js"]
          missing = [x for x in required if not (assets / x).is_file()]
          if missing:
              raise SystemExit("missing packaged H5 files: " + ", ".join(missing))
          required_runtime_assets = [
              "atlas/combat/animation0.atlas",
              "atlas/combat/frmBattle.atlas",
              "atlas/combat/ani1.atlas",
              "atlas/mainUI/laba02_bg.png",
              "atlas/Checkpoint/MainChallenge.atlas",
              "atlas/Checkpoint/offLineGiftPanel.atlas",
              "atlas/CombatFormation.atlas",
              "atlas/NewBag.atlas",
              "atlas/Task.atlas",
              "atlas/bx.atlas",
              "res/items/1/1001021.png",
              "res/icons/rhyd_01.png",
              "res/icons/zuan01.png",
              "res/items/1/1001259.png",
              "res/items/1/1001011.png",
              "atlas/receive.atlas",
              "atlas/receive/title.atlas",
              "atlas/receive/bgAni1.atlas",
              "atlas/receive/huode_shilianb.png",
              "atlas/equipmentAlert.atlas",
              "atlas/ElfSummon.atlas",
              "atlas/PerserateSpace/Ani3.atlas",
              "atlas/Town.atlas",
              "res/icons/rhyd_02.png",
              "res/icons/zhyd_01.png",
              "res/icons/zhyd_02.png",
              "res/items/1/1001034.png",
              "atlas/combat/result.atlas",
              "atlas/combat/communicator.atlas",
              "atlas/Checkpoint/MainChallenge/bg1.png",
              "atlas/Checkpoint/MainChallenge/bg2.png",
              "atlas/Checkpoint/MainChallenge/bg3.png",
              "atlas/Checkpoint/MainChallenge/bg4.png",
              "atlas/Checkpoint/offLineGiftPanel/bg_gjsy.png",
              "atlas/combat/animation/SpiritCut.ani",
              "atlas/combat/animation/Expo.ani",
              "atlas/combat/animation/TallLight.ani",
              "atlas/combat/animation/SpiritDie.ani",
              "atlas/combat/animation/Imprison.ani",
              "atlas/combat/animation/EnterDown.ani",
              "atlas/combat/animation/EnterUp.ani",
              "res/icons/jingyan1.png",
              "res/icons/xuanshang1.png",
              "res/icons/icon_exp.png",
              "res/icons/txmon124.png",
              "res/items/4/4000001.png",
              "res/items/4/4000002.png",
              "res/items/4/4000003.png",
              "res/items/4/4000004.png",
              "res/items/1/1000019.png",
              "res/items/1/1001019.png",
              "res/combat/spirits/mon124.png",
              "res/music/20001.wav",
              "res/music/20019.wav",
          ]
          missing_runtime = [name for name in required_runtime_assets if not (assets / name).is_file()]
          for atlas_name in [name for name in required_runtime_assets if name.endswith(".atlas")]:
              try:
                  atlas_data = json.loads((assets / atlas_name).read_text(encoding="utf-8"))
                  image_name = atlas_data.get("meta", {}).get("image")
                  if image_name:
                      image_path = (assets / atlas_name).parent / image_name
                      if not image_path.is_file():
                          missing_runtime.append(image_path.relative_to(assets).as_posix())
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  missing_runtime.append(f"{atlas_name} (invalid atlas: {exc})")
          if missing_runtime:
              raise SystemExit("missing runtime assets: " + ", ".join(missing_runtime))
          ani1_path = assets / "atlas/combat/ani1.atlas"
          ani1_data = json.loads(ani1_path.read_text(encoding="utf-8"))
          ani1_frames = set(ani1_data.get("frames", {}))
          expected_ani1_frames = {"jg1.png", "jg2.png", "jg3.png", "jg4.png", "jg5.png", "jg6.png", "jg7.png", "jingu.png"}
          missing_ani1_frames = sorted(expected_ani1_frames - ani1_frames)
          if ani1_data.get("meta", {}).get("prefix") != "combat/ani1/" or missing_ani1_frames:
              raise SystemExit("invalid combat/ani1 atlas metadata or frames: " + ", ".join(missing_ani1_frames))
          print("Verified combat/ani1 atlas frame definitions:", len(ani1_frames))
          print("Verified runtime atlases and standalone images:", *required_runtime_assets, sep="\\n  ")
          print("Packaged local H5 bytes:", sum(p.stat().st_size for p in assets.rglob("*") if p.is_file()))
          PY

      - name: Rebuild APK
        run: |
          apktool b tmp/offline-build/decoded -o tmp/offline-build/unsigned.apk
          test -s tmp/offline-build/unsigned.apk

      - name: Align and sign APK
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -noprompt -keystore tmp/offline-build/offline.keystore \
            -storepass offline-local-build -keypass offline-local-build \
            -alias offline -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Super Spirit Ball Offline, OU=Preservation, O=Local, C=CN"
          "$BT/zipalign" -p -f 4 tmp/offline-build/unsigned.apk tmp/offline-build/aligned.apk
          "$BT/apksigner" sign --ks tmp/offline-build/offline.keystore \
            --ks-key-alias offline --ks-pass pass:offline-local-build \
            --key-pass pass:offline-local-build \
            --out dist/super-spirit-ball-offline.apk tmp/offline-build/aligned.apk
          "$BT/apksigner" verify --verbose dist/super-spirit-ball-offline.apk
          sha256sum dist/super-spirit-ball-offline.apk | tee dist/SHA256SUMS.txt
          APK_SHA256="$(sha256sum dist/super-spirit-ball-offline.apk | awk '{print $1}')"
          export APK_SHA256
          python3 - <<'PY'
          import os
          from pathlib import Path

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          apk_sha256 = os.environ["APK_SHA256"]

          Path("dist/README.md").write_text(
              f"""# Super Spirit Ball — offline APK

          - Build/test run: [#{run_number}]({run_url})
          - File: `super-spirit-ball-offline.apk`
          - SHA-256: `{apk_sha256}`
          - Validation: `OFFLINE_SCENE_TEST=PASS`.

          This APK uses a local test signing key and is not signed with the original publisher key.
          Uninstall the original app before installing this build; uninstalling may remove its app data.
          """,
              encoding="utf-8",
          )
          PY
          grep -Fq "$APK_SHA256" dist/README.md
          grep -Fq 'OFFLINE_SCENE_TEST=PASS' dist/README.md
          ls -lh dist/super-spirit-ball-offline.apk

      - name: Install and launch with network disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4G
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            timeout --signal=TERM --kill-after=30s 25m bash work/tools/test_offline_apk.sh

      - name: Upload offline APK and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-apk-test-${{ github.run_number }}
          path: |
            dist/
            tmp/offline-test/
            tmp/offline-build/snapshot-summary.json
            tmp/offline-build/snapshot-manifest.json
            tmp/offline-build/native-network-dialog-patch.txt
            tmp/offline-build/snapshot-manifest.json
          if-no-files-found: warn
          retention-days: 30
